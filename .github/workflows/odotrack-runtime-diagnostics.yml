name: OdoTrack runtime read-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/odotrack-runtime-diagnostics.yml'

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 8
    steps:
      - name: Inspect existing production service state without changing containers
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = agent
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DOCKER_HOST="unix:///run/user/${uid}/docker.sock"
          docker info >/dev/null
          python3 - <<'PY'
          import json
          import subprocess
          for service in ("db", "redis", "app", "worker"):
              name = f"odo_track-{service}-1"
              proc = subprocess.run(["docker", "inspect", name], capture_output=True, text=True)
              if proc.returncode:
                  print(f"{service}: missing, inspect_rc={proc.returncode}")
                  continue
              obj = json.loads(proc.stdout)[0]
              state = obj.get("State") or {}
              health = state.get("Health") or {}
              print(json.dumps({
                  "service": service,
                  "name": name,
                  "status": state.get("Status"),
                  "running": state.get("Running"),
                  "restart_count": obj.get("RestartCount"),
                  "exit_code": state.get("ExitCode"),
                  "state_error_type": (state.get("Error") or "").split(":")[0][:80],
                  "health": health.get("Status", "none"),
                  "health_exit_codes": [entry.get("ExitCode") for entry in health.get("Log", [])],
                  "health_observations": len(health.get("Log", [])),
                  "started_at": state.get("StartedAt"),
              }, ensure_ascii=False))
              if service == "db" and state.get("Running"):
                  res = subprocess.run(["docker","exec",name,"sh","-c",
                      'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1'])
                  print(f"db_pg_isready_rc={res.returncode}")
              if service == "redis" and state.get("Running"):
                  res = subprocess.run(["docker","exec",name,"redis-cli","ping"],capture_output=True,text=True)
                  print(f"redis_ping_rc={res.returncode}; pong={res.stdout.strip()=='PONG'}")
          PY
          # Read Redis startup logs only. Produce normalized failure hints, no raw data,
          # paths, credentials, Redis payloads or unbounded log content.
          docker logs --tail 160 odo_track-redis-1 2>&1 | python3 -c '
          import re,sys,json
          raw=sys.stdin.read().lower()
          flags={
            "permission_denied": r"permission denied|operation not permitted",
            "aof_corruption": r"bad file format|append only file is not valid|unexpected end of file|aof.*corrupt|corrupt.*aof",
            "aof_loading_failure": r"fatal error.*aof|reading the append only file|short read.*aof",
            "rdb_loading_failure": r"fatal error.*rdb|short read.*rdb|rdb.*corrupt|rdb.*format",
            "disk_full": r"no space left on device|disk full",
            "oom": r"cannot allocate memory|out of memory|oom",
            "read_only": r"read-only file system",
            "config_failure": r"fatal config file error|bad directive",
            "fatal_signal": r"signal 11|segmentation fault|sigsegv",
            "background_save": r"background saving error|failed saving",
            "redis_usable": r"ready to accept connections",
            "raw_fatal": r"fatal|error|fail",
          }
          print("redis_log_error_flags="+json.dumps({k:bool(re.search(v,raw)) for k,v in flags.items()},sort_keys=True))
          print("redis_log_line_count="+str(len(raw.splitlines())))
          '
          python3 - <<'PY'
          import json, subprocess, re
          ins=subprocess.run(["docker","inspect","odo_track-redis-1"],capture_output=True,text=True,check=True)
          mount=next((m for m in json.loads(ins.stdout)[0].get("Mounts",[]) if m.get("Destination")=="/data"),None)
          if not mount or mount.get("Type")!="volume":
              raise SystemExit("redis_data_volume_not_found")
          volume=mount["Name"]
          print("redis_volume_type=managed_named_volume")
          result=subprocess.run([
              "docker","run","--rm","--network","none","-v",f"{volume}:/data:ro",
              "--entrypoint","sh","redis:7-alpine","-c",
              'find /data -maxdepth 2 -type f -exec stat -c "%n %s" {} \\;'
          ],capture_output=True,text=True,timeout=35)
          print("redis_volume_metadata_rc=",result.returncode)
          for line in result.stdout.splitlines():
              if line.startswith("/data/"):
                  print("redis_file="+line[:220])
          filelines=result.stdout.lower()
          manifest="/data/appendonlydir/appendonly.aof.manifest" if "appendonly.aof.manifest" in filelines else "/data/appendonly.aof"
          chk=subprocess.run([
              "docker","run","--rm","--network","none","-v",f"{volume}:/data:ro",
              "--entrypoint","redis-check-aof","redis:7-alpine",manifest
          ],capture_output=True,text=True,timeout=45)
          print("redis_aof_check_rc=",chk.returncode)
          out=chk.stdout+"\\n"+chk.stderr
          for line in out.splitlines():
              if re.search(r"aof analyzed|ok_up_to|file size|valid|corrupt|error|diff|truncat|not exist|not found",line,re.I):
                  clean=re.sub(r"(/[^\s,]+)", "<path>",line)
                  print("redis_aof_check_summary="+clean[:280])
          PY
          for url in http://127.0.0.1:3100/up https://odt.hiroyuki9614.com/up; do
            printf 'health_http='
            curl --silent --output /dev/null --write-out '%{http_code}\n' --max-time 7 -H 'X-Forwarded-Proto: https' "$url" || true
          done
