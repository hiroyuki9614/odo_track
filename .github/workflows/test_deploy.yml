name: Test and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: odo-track-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # Never execute untrusted fork code on the production self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Bind rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "agent"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///run/user/${uid}/docker.sock" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DOCKER_HOST="unix:///run/user/${uid}/docker.sock"
          docker info >/dev/null

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t "odo-track-ci:${GITHUB_SHA}" .

      - name: Run assets and RSpec
        run: docker run --rm "odo-track-ci:${GITHUB_SHA}"

      - name: Cleanup CI image
        if: always()
        run: docker image rm -f "odo-track-ci:${GITHUB_SHA}" >/dev/null 2>&1 || true

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Bind rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "agent"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///run/user/${uid}/docker.sock" >> "$GITHUB_ENV"

      - name: Deploy current main to VPS
        run: bash scripts/deploy_production.sh
