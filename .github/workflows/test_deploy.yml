name: Test and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: odo-track-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # Never execute untrusted fork code on the production self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Bind rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "agent"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///run/user/${uid}/docker.sock" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DOCKER_HOST="unix:///run/user/${uid}/docker.sock"
          docker info >/dev/null

      - name: Validate deployment housekeeping
        run: |
          bash -n scripts/deploy_production.sh scripts/docker_housekeeping.sh tests/scripts/docker_housekeeping_test.sh
          bash tests/scripts/docker_housekeeping_test.sh

      - name: Remove unused legacy OdoTrack test images only
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            odo-track-ci:main-repro-28c2 \
            odo-track-ci:healthcheck-local \
            odo-track-ios-form-fix:test \
            odo-track-preflight:a4aa63f
          do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              continue
            fi
            if [[ -n "$(docker ps --all --quiet --filter "ancestor=$image")" ]]; then
              echo "preserving image referenced by a container: $image"
              continue
            fi
            docker image rm "$image" || echo "preserving image that cannot be safely removed: $image"
          done

      - name: Reclaim old unreferenced Docker images under disk pressure
        shell: bash
        run: |
          set -euo pipefail
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          disk_usage="$(df -P "$docker_root" | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }')"
          [[ "$disk_usage" =~ ^[0-9]+$ ]] || exit 1
          if (( disk_usage >= 95 )); then
            echo "Docker storage is at ${disk_usage}%; removing only unused images older than 24h"
            # Docker preserves every image referenced by a container, including stopped containers.
            # Do not prune containers or volumes and never force-remove referenced images.
            docker image prune --all --force --filter 'until=24h'
          fi

      - name: Reclaim Docker headroom before CI build
        run: bash scripts/docker_housekeeping.sh pre-build

      - name: Report Docker capacity when build is blocked
        if: failure()
        shell: bash
        run: |
          df -h /home/agent/.local/share/docker || true
          docker system df || true
          echo "OdoTrack image references (read-only):"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -E '^(odo[_-]track|<none>)' | head -40 || true

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t "odo-track-ci:${GITHUB_SHA}" .

      - name: Run assets and RSpec
        run: docker run --rm "odo-track-ci:${GITHUB_SHA}"

      - name: Cleanup CI image
        if: always()
        run: docker image rm -f "odo-track-ci:${GITHUB_SHA}" >/dev/null 2>&1 || true

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Bind rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "agent"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///run/user/${uid}/docker.sock" >> "$GITHUB_ENV"

      - name: Deploy current main to VPS
        run: bash scripts/deploy_production.sh
