name: Stage corrupted OdoTrack Redis AOF without modifying source data

on:
  pull_request:
    paths:
      - '.github/workflows/odotrack-redis-aof-staging.yml'
      - 'scripts/stage_redis_aof_recovery.sh'

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/odotrack-redis-aof-staging-20261031'
    runs-on: [self-hosted, Linux, X64, odo-track]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Back up Redis original and check separate AOF clone
        shell: bash
        run: bash scripts/stage_redis_aof_recovery.sh
