services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - odo-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      PORT: 3000
      BIND: 0.0.0.0
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${ODO_HOST_PORT:-3100}:3000"
    volumes:
      - odo-storage:/app/storage
      - odo-downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - odo-storage:/app/storage
      - odo-downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bundle exec sidekiq
    restart: unless-stopped

volumes:
  odo-postgres-data:
  odo-redis-data:
  odo-storage:
  odo-downloads:
